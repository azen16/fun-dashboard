<mat-grid-list cols="4" rowHeight="2:1">
  <mat-grid-tile>
    @if (!store.currentDog().breed) {
    <p>Loading...</p>
    } @else {
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ store.currentDog().breed | dogName }}</mat-card-title>
      </mat-card-header>
      <img mat-card-image [src]="store.currentDog().image" [alt]="store.currentDog().breed | dogName">
    </mat-card>
    }
  </mat-grid-tile>
</mat-grid-list>
