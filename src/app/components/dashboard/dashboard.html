<mat-grid-list cols="3" rowHeight="2:1">
  <mat-grid-tile>
    @if (store.loading()) {
      <p>Loading...</p>
    } @else if (store.currentDog()) {
      <img [src]="store.currentDog()" alt="Random Dog" style="max-width: 100%; max-height: 100%; object-fit: contain;">
    }
  </mat-grid-tile>
</mat-grid-list>
